<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Smashy Karted</title>
<meta name="description" content="Smashy Karted: math practice and an online kart game, in your browser.">
<meta name="theme-color" content="#2f86e0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%8E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* Kart Brawl: menu, HUD and touch controls. No web fonts or images, so the page
   is usable the moment the HTML arrives. */

:root {
  --ink: #17233a;
  --ink-soft: #3b4a66;
  --paper: #ffffff;
  --sky: #2f86e0;
  --sun: #ffd23d;
  --sun-deep: #ff9f1c;
  --good: #4dd96b;
  --bad: #ff4d4d;
  --info: #3de0d0;
  --kc: #ffd23d;
  --shadow: 0 4px 0 rgba(23, 35, 58, 0.9);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  --display: "Arial Black", "Segoe UI Black", "Helvetica Neue", Impact, system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(#2f86e0, #c4ecff);
  color: var(--paper);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  overscroll-behavior: none;
}

#view {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

button { font: inherit; color: inherit; cursor: pointer; }
kbd {
  display: inline-block;
  min-width: 1.7em;
  padding: 0.1em 0.4em;
  margin-right: 0.15em;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--ink);
  font: 800 0.8em var(--font);
  text-align: center;
  box-shadow: 0 2px 0 rgba(23, 35, 58, 0.6);
}

.nojs {
  position: fixed; inset: 0; display: grid; place-items: center;
  font: 800 20px var(--font); color: var(--ink);
}

/* ---------------------------------------------------------------- menu */

.menu {
  position: fixed;
  inset: 0;
  display: none;
  overflow-y: auto;
  touch-action: pan-y;
  /* darken the edges so panels read over the 3D showroom behind them */
  background:
    linear-gradient(90deg, rgba(23, 35, 58, 0.55), rgba(23, 35, 58, 0) 30%, rgba(23, 35, 58, 0) 70%, rgba(23, 35, 58, 0.55)),
    linear-gradient(rgba(23, 35, 58, 0.35), rgba(23, 35, 58, 0) 22%, rgba(23, 35, 58, 0) 72%, rgba(23, 35, 58, 0.5));
}
.menu.on { display: block; }

.m-wrap {
  min-height: 100%;
  display: grid;
  grid-template-columns: minmax(260px, 340px) 1fr minmax(260px, 340px);
  grid-template-rows: auto 1fr auto;
  grid-template-areas: "top top top" "left stage right" "bottom bottom bottom";
  gap: 16px 24px;
  padding: 20px 28px 24px;
}

.m-top {
  grid-area: top;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.logo {
  margin: 0;
  display: flex;
  gap: 0.22em;
  font: 900 clamp(34px, min(5vw, 8vh), 64px) var(--display);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--sun);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--ink), 0 12px 20px rgba(23, 35, 58, 0.35);
  transform: rotate(-2deg);
  animation: logo-in 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both;
}
.logo .l2 { color: var(--paper); }

.m-panel {
  align-self: center;
  padding: 18px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--ink);
  border: 3px solid var(--ink);
  box-shadow: 0 7px 0 var(--ink), 0 22px 40px rgba(23, 35, 58, 0.3);
  animation: card-in 0.5s 0.08s cubic-bezier(0.2, 1.4, 0.4, 1) both;
}
.m-left { grid-area: left; }
.m-right { grid-area: right; animation-delay: 0.14s; }

.m-stage {
  grid-area: stage;
  position: relative;
  min-height: 260px;
  pointer-events: none;
}
.m-plate {
  position: absolute;
  left: 50%;
  bottom: 4%;
  transform: translateX(-50%) rotate(-1.5deg);
  padding: 8px 22px;
  border-radius: 14px;
  border: 3px solid var(--ink);
  background: var(--kc);
  color: var(--ink);
  font: 900 clamp(18px, 2.4vw, 26px) var(--display);
  white-space: nowrap;
  box-shadow: 0 5px 0 var(--ink);
}

.m-bottom {
  grid-area: bottom;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.tag {
  margin: 0;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.02em;
  text-shadow: 0 2px 0 rgba(23, 35, 58, 0.55);
}

.lbl {
  display: block;
  margin: 0 0 8px 2px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

#name {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  margin-bottom: 16px;
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: #f2f6fc;
  color: var(--ink);
  font: 800 19px var(--font);
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
#name:focus { background: #fff; border-color: var(--sky); }

.colors {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}
.colors button {
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: var(--c);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18);
  transition: transform 0.12s;
}
.colors button:hover { transform: scale(1.1); }
.colors button.on {
  transform: scale(1.12);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 0 0 3px #fff, 0 0 0 6px var(--ink);
}

.play {
  position: relative;
  width: min(100%, 420px);
  height: 78px;
  border: 3px solid var(--ink);
  border-radius: 22px;
  background: linear-gradient(var(--sun), var(--sun-deep));
  color: var(--ink);
  font: 900 38px var(--display);
  letter-spacing: 0.08em;
  box-shadow: 0 7px 0 var(--ink), 0 18px 34px rgba(23, 35, 58, 0.35);
  transition: transform 0.08s, box-shadow 0.08s;
  animation: play-pulse 1.6s 1s ease-in-out infinite;
}
.play:hover { filter: brightness(1.06); }
.play:active, .play.busy { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink); animation: none; }
.play.busy { font-size: 24px; filter: saturate(0.6); }

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 3px solid var(--ink);
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 3px 0 var(--ink);
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
}
.status i {
  flex: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #aab4c5;
}
.status.good i { background: var(--good); box-shadow: 0 0 0 3px rgba(77, 217, 107, 0.3); }
.status.off i { background: var(--sun-deep); }
.status.wait i { background: var(--sky); animation: blink 0.8s ease-in-out infinite alternate; }

.opts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.pill {
  height: 40px;
  padding: 0 14px;
  border: 3px solid var(--ink);
  border-radius: 999px;
  background: #f2f6fc;
  color: var(--ink);
  font-weight: 800;
  font-size: 14px;
  box-shadow: 0 3px 0 var(--ink);
}
.pill:hover { background: #fff; }
.pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.pill.on { background: #fff; }

.keys {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin: 0;
  padding: 12px 0 0;
  border-top: 2px dashed #d5dcea;
  list-style: none;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
}
.keys kbd { background: var(--ink); color: #fff; box-shadow: none; }
@media (pointer: coarse) { .keys { display: none; } }

/* narrow screens: kart on top, panels stacked under it, page scrolls */
@media (max-width: 820px) {
  .m-wrap {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(34vh, auto) auto auto auto;
    grid-template-areas: "top" "stage" "bottom" "left" "right";
    gap: 14px;
    padding: 14px 16px 24px;
  }
  .m-top { flex-wrap: wrap; justify-content: center; }
  .m-stage { min-height: 34vh; }
  .m-panel { align-self: stretch; }
  .menu { background: linear-gradient(rgba(23, 35, 58, 0.3), rgba(23, 35, 58, 0) 20%, rgba(23, 35, 58, 0) 40%, rgba(23, 35, 58, 0.55) 60%); }
}

@keyframes logo-in { from { transform: rotate(-3deg) scale(0.4); opacity: 0; } }
@keyframes card-in { from { transform: translateY(40px); opacity: 0; } }
@keyframes play-pulse { 50% { transform: scale(1.03); } }
@keyframes blink { to { opacity: 0.3; } }

/* ---------------------------------------------------------------- HUD */

.hud {
  position: fixed;
  inset: 0;
  display: none;
  pointer-events: none;
  font-weight: 800;
  text-shadow: 0 2px 0 rgba(23, 35, 58, 0.75);
  --edge: max(14px, env(safe-area-inset-left));
}
.hud.on { display: block; }

.h-rank {
  position: absolute;
  top: 12px;
  left: var(--edge);
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.h-pos {
  font: 900 46px/1 var(--display);
  color: var(--sun);
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--ink);
}
.h-pos small { font-size: 0.45em; color: #fff; }
.h-pts { font-size: 18px; }
.h-pts b { font-size: 24px; }

.h-leaders {
  position: absolute;
  top: 70px;
  left: var(--edge);
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 14px;
}
.h-leaders li {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 172px;
  margin-bottom: 4px;
  padding: 3px 10px 3px 6px;
  border-radius: 10px;
  background: rgba(23, 35, 58, 0.45);
}
.h-leaders li.me { background: rgba(214, 140, 0, 0.75); }
.h-leaders em { font-style: normal; width: 14px; text-align: center; opacity: 0.8; }
.h-leaders i, .h-board i, .h-rlist i {
  flex: none;
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  vertical-align: -1px;
  margin-right: 6px;
}
.h-leaders i { margin-right: 0; }
.h-leaders span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.h-timer {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  min-width: 112px;
  padding: 6px 18px;
  border: 3px solid var(--ink);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--ink);
  font: 900 30px/1 var(--display);
  text-align: center;
  text-shadow: none;
  box-shadow: var(--shadow);
  font-variant-numeric: tabular-nums;
}
.h-timer.hurry { background: var(--bad); color: #fff; animation: hurry 1s ease-in-out infinite; }
.hud.results .h-timer { opacity: 0; }

.h-feed {
  position: absolute;
  top: 12px;
  right: max(14px, env(safe-area-inset-right));
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  font-size: 14px;
}
.h-fline {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 10px;
  background: rgba(23, 35, 58, 0.55);
  animation: feed-in 0.25s ease-out;
  transition: opacity 0.5s, transform 0.5s;
}
.h-fline.mine { background: rgba(214, 140, 0, 0.75); }
.h-fline.out { opacity: 0; transform: translateX(20px); }
.h-fline em { font-style: normal; font-weight: 700; opacity: 0.85; }
.h-fline b { max-width: 120px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.h-center {
  position: absolute;
  top: 26%;
  left: 0;
  right: 0;
  text-align: center;
}
.h-toast {
  display: inline-block;
  padding: 0 16px;
  font: 900 clamp(30px, 7vw, 56px)/1.05 var(--display);
  color: #fff;
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--ink);
  opacity: 0;
}
.h-toast.good { color: var(--sun); }
.h-toast.bad { color: var(--bad); }
.h-toast.info { color: var(--info); }
.h-toast.go { color: var(--good); font-size: clamp(56px, 16vw, 120px); }
.h-toast.show { animation: toast-in 0.4s cubic-bezier(0.2, 1.8, 0.4, 1) both; }
.h-toast.hide { animation: toast-out 0.3s ease-in both; }
.h-sub {
  margin-top: 8px;
  font-size: 18px;
  opacity: 0;
  transition: opacity 0.2s;
}
.h-sub.show { opacity: 1; }

.h-respawn {
  position: absolute;
  top: 52%;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 20px;
  display: none;
}
.h-respawn.on { display: block; }
.h-respawn b { font: 900 34px var(--display); color: var(--sun); margin-left: 4px; }

.h-weapon {
  position: absolute;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(16px, env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  flex-direction: row-reverse;
  gap: 10px;
  --wc: #fff;
}
.h-wicon {
  display: grid;
  place-items: center;
  width: 84px;
  height: 84px;
  border-radius: 24px;
  border: 4px solid var(--ink);
  background: radial-gradient(circle at 50% 35%, #fff 0%, var(--wc) 140%);
  box-shadow: 0 5px 0 var(--ink), inset 0 0 0 4px var(--wc);
  font-size: 46px;
  line-height: 1;
  text-shadow: none;
}
.h-weapon.empty .h-wicon {
  background: rgba(23, 35, 58, 0.35);
  box-shadow: 0 5px 0 rgba(23, 35, 58, 0.5);
  border-color: rgba(23, 35, 58, 0.6);
  border-style: dashed;
}
.h-weapon.empty .h-wicon::after {
  content: "?";
  font: 900 34px var(--display);
  color: rgba(255, 255, 255, 0.55);
}
.h-weapon.pop .h-wicon { animation: pop 0.35s cubic-bezier(0.2, 2, 0.4, 1); }
.h-wtext { text-align: right; }
.h-wname { font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em; }
.h-pips { display: flex; justify-content: flex-end; gap: 4px; margin-top: 5px; }
.h-pips i {
  width: 12px;
  height: 12px;
  border-radius: 4px;
  border: 2px solid var(--ink);
  background: rgba(255, 255, 255, 0.25);
}
.h-pips i.on { background: var(--wc); }
.h-count { font: 900 24px var(--display); color: var(--wc); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.h-aura {
  position: absolute;
  right: 0;
  bottom: -9px;
  width: 84px;
  height: 7px;
  border-radius: 4px;
  background: rgba(23, 35, 58, 0.6);
  overflow: hidden;
}
.h-aura i { display: block; height: 100%; background: var(--wc); transition: width 0.1s linear; }

.h-hp {
  position: absolute;
  left: 50%;
  bottom: max(18px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(260px, 46vw);
  height: 24px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: rgba(23, 35, 58, 0.55);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.h-hp i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  background: var(--good);
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.15), inset 0 4px 0 rgba(255, 255, 255, 0.35);
  transition: width 0.2s ease-out, background 0.2s;
}
.h-hp.mid i { background: var(--sun); }
.h-hp.low i { background: var(--bad); animation: blink 0.4s ease-in-out infinite alternate; }
.h-hp span {
  position: relative;
  display: block;
  font-size: 14px;
  line-height: 18px;
  text-align: center;
}

.h-frozen {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 70px;
  text-align: center;
  font: 900 28px var(--display);
  color: #bdf3ff;
  letter-spacing: 0.1em;
  display: none;
}
.h-frozen.on { display: block; animation: blink 0.3s ease-in-out infinite alternate; }

.h-stats {
  position: absolute;
  left: var(--edge);
  bottom: max(12px, env(safe-area-inset-bottom));
  font-size: 12px;
  font-weight: 700;
  opacity: 0.75;
}

.h-hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 54px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  transition: opacity 1s;
}
.hud.hint-off .h-hint, .hud.touch .h-hint { opacity: 0; }

.h-board {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  min-width: min(440px, calc(100vw - 32px));
  padding: 12px 14px;
  border: 3px solid var(--ink);
  border-radius: 18px;
  background: rgba(23, 35, 58, 0.82);
  display: none;
}
.h-board.on { display: block; }
.h-board table, .h-rlist { width: 100%; border-collapse: collapse; font-size: 15px; }
.h-board th { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; padding: 0 8px 6px; text-align: left; }
.h-board td { padding: 6px 8px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
.h-board td:nth-child(n+3), .h-board th:nth-child(n+3) { text-align: right; width: 1%; white-space: nowrap; }
.h-board tr.me td { background: rgba(255, 210, 61, 0.25); }
.h-board small { font-size: 10px; opacity: 0.6; margin-left: 4px; }

.h-results {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  background: radial-gradient(ellipse at 50% 45%, rgba(23, 35, 58, 0.35), rgba(23, 35, 58, 0.8));
}
.h-results.on { display: flex; animation: fade 0.4s ease-out; }
.hud.results > :not(.h-results):not(.h-stats) { opacity: 0; }
.h-rtitle {
  font: 900 clamp(34px, 8vw, 64px)/1 var(--display);
  color: var(--sun);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--ink);
  transform: rotate(-2deg);
  animation: toast-in 0.5s cubic-bezier(0.2, 1.8, 0.4, 1) both;
}
.h-podium {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-top: 6px;
}
.h-step { display: flex; flex-direction: column; align-items: center; width: min(120px, 28vw); }
.h-step.empty { visibility: hidden; }
.h-pname {
  max-width: 100%;
  margin: 4px 0;
  font-size: 15px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.h-step.me .h-pname { color: var(--sun); }
.h-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  padding-top: 8px;
  border: 3px solid var(--ink);
  border-radius: 12px 12px 0 0;
  background: linear-gradient(#ffffff, #d7e3f4);
  color: var(--ink);
  text-shadow: none;
  box-shadow: inset 0 -6px 0 rgba(23, 35, 58, 0.12);
}
.h-block b { font: 900 34px/1 var(--display); }
.h-block span { font-size: 13px; margin-top: 2px; }
.h-step.p1 .h-block { height: 118px; background: linear-gradient(#ffe36e, #ffb52e); }
.h-step.p2 .h-block { height: 88px; }
.h-step.p3 .h-block { height: 66px; background: linear-gradient(#ffd0a6, #e8945a); }
.h-step.p1 { animation: rise 0.5s 0.25s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
.h-step.p2 { animation: rise 0.5s 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
.h-step.p3 { animation: rise 0.5s 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) both; }

/* a tiny kart drawn in CSS: body, cockpit and two wheels */
.h-kart {
  position: relative;
  width: 58px;
  height: 30px;
  margin-top: 6px;
  border: 3px solid var(--ink);
  border-radius: 12px 14px 8px 8px;
  background: var(--kc);
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.18);
}
.h-kart::before {
  content: "";
  position: absolute;
  left: 15px;
  top: -14px;
  width: 22px;
  height: 18px;
  border: 3px solid var(--ink);
  border-radius: 50% 50% 4px 4px;
  background: #fff;
}
.h-kart::after {
  content: "";
  position: absolute;
  left: 2px;
  right: 2px;
  bottom: -11px;
  height: 14px;
  background:
    radial-gradient(circle at 9px 7px, var(--ink) 6px, transparent 7px),
    radial-gradient(circle at calc(100% - 9px) 7px, var(--ink) 6px, transparent 7px);
}
.h-step.p1 .h-kart { animation: bounce 0.7s 0.8s ease-in-out infinite alternate; }

.h-rlist { max-width: 360px; margin-top: 4px; }
.h-rlist td { padding: 4px 8px; }
.h-rlist td:first-child { width: 24px; opacity: 0.7; }
.h-rlist td:last-child { text-align: right; }
.h-rlist tr.me td { color: var(--sun); }
.h-next { margin-top: 6px; font-size: 16px; opacity: 0.9; }

.h-vignette {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 40, 40, 0.75) 100%);
  transition: opacity 0.35s ease-out;
}

@keyframes hurry { 50% { transform: translateX(-50%) scale(1.08); } }
@keyframes feed-in { from { opacity: 0; transform: translateX(30px); } }
@keyframes toast-in { from { opacity: 0; transform: scale(2.2); } to { opacity: 1; } }
@keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: scale(0.8); } }
@keyframes pop { 50% { transform: scale(1.25) rotate(-6deg); } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(60px); } }
@keyframes bounce { to { transform: translateY(-6px); } }

/* ---------------------------------------------------------------- touch */

.touch { display: none; }
.touch.show { display: block; }
.tpad {
  position: fixed;
  bottom: max(18px, env(safe-area-inset-bottom));
  display: flex;
  gap: 12px;
  z-index: 2;
}
.tleft { left: max(18px, env(safe-area-inset-left)); }
.tright {
  right: max(18px, env(safe-area-inset-right));
  display: grid;
  grid-template-columns: 74px 92px;
  grid-template-rows: 62px 80px;
  gap: 10px;
}
.tpad button {
  border: 3px solid rgba(23, 35, 58, 0.85);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.28);
  color: #fff;
  font: 900 15px var(--display);
  text-shadow: 0 2px 0 rgba(23, 35, 58, 0.7);
  touch-action: none;
  backdrop-filter: blur(2px);
}
.tpad button.on { background: rgba(255, 255, 255, 0.6); transform: scale(0.94); }
.tleft button { width: 84px; height: 84px; font-size: 30px; border-radius: 50%; }
.tdrift { grid-column: 1; grid-row: 1; }
.tfire { grid-column: 2; grid-row: 1; background: rgba(255, 77, 77, 0.55) !important; }
.tfire.on { background: rgba(255, 77, 77, 0.85) !important; }
.tbrake { grid-column: 1; grid-row: 2; }
.tgas { grid-column: 2; grid-row: 2; background: rgba(77, 217, 107, 0.5) !important; }
.tgas.on { background: rgba(77, 217, 107, 0.85) !important; }

/* make room for the pads: weapon slot and health bar move up */
.hud.touch .h-weapon { bottom: 190px; }
.hud.touch .h-hp { bottom: auto; top: 64px; width: min(200px, 40vw); height: 20px; }
.hud.touch .h-hp span { line-height: 14px; font-size: 12px; }
.hud.touch .h-stats { bottom: 116px; }
.hud.touch .h-frozen { bottom: auto; top: 40%; }

@media (max-width: 640px) {
  .h-pos { font-size: 36px; }
  .h-leaders { display: none; }
  .h-timer { font-size: 24px; min-width: 90px; padding: 5px 12px; }
  .h-feed { top: 56px; font-size: 12px; }
  .h-wicon { width: 70px; height: 70px; font-size: 38px; border-radius: 20px; }
  .h-wname { font-size: 15px; }
  .h-aura { width: 70px; }
}
@media (max-height: 460px) and (min-width: 821px) {
  .m-wrap { gap: 8px 16px; padding: 10px 20px 12px; }
  .logo { font-size: 32px; }
  .tag, .keys { display: none; }
  .m-panel { padding: 12px 14px; }
  .play { height: 58px; font-size: 28px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}

/* math mode: question card above the weapon slot */
.h-math {
  position: absolute;
  right: max(16px, env(safe-area-inset-right));
  bottom: calc(max(16px, env(safe-area-inset-bottom)) + 104px);
  display: none;
  padding: 10px 12px 12px;
  border: 4px solid var(--ink);
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 5px 0 var(--ink);
  color: var(--ink);
  text-align: center;
  pointer-events: auto;
}
.h-math.on { display: block; animation: pop 0.3s cubic-bezier(0.2, 2, 0.4, 1); }
.h-math.wrong { animation: shake 0.35s; background: #ffd6dc; }
.hm-q { font: 900 24px var(--display); margin-bottom: 8px; }
.hm-a { display: flex; gap: 6px; }
.hm-a button {
  min-width: 56px;
  padding: 8px 6px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: var(--sun, #ffc93c);
  font: 900 20px var(--display);
  color: var(--ink);
  cursor: pointer;
}
.hm-a button small { display: block; font: 800 10px var(--font); opacity: 0.6; }
.h-math.wrong .hm-a button { opacity: 0.5; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---------------------------------------------------------------- home + math practice */

.home, .practice {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: none;
  overflow-y: auto;
  background: linear-gradient(160deg, #6fc8ff, #2f86e0);
  color: var(--ink);
}
.home.on, .practice.on { display: block; }
.h-wrap, .p-wrap {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 24px 16px;
}
.h-sub { margin: 0; font: 800 18px var(--font); color: #fff; }
.h-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
.h-card {
  width: min(100%, 300px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 26px 20px;
  border: 4px solid var(--ink);
  border-radius: 26px;
  background: #fff;
  box-shadow: 0 7px 0 var(--ink);
  color: var(--ink);
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
}
.h-card:hover { transform: translateY(-3px); }
.h-card:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink); }
.h-card b { font-size: 52px; line-height: 1; }
.h-card span { font: 900 26px var(--display); }
.h-card small { font: 700 14px var(--font); opacity: 0.7; }
.h-card.math { background: linear-gradient(#fff, #e3f6ff); }
.h-card.kart { background: linear-gradient(var(--sun), var(--sun-deep)); }

.m-topr { display: flex; align-items: center; gap: 10px; }

.p-wrap { justify-content: flex-start; max-width: 640px; margin: 0 auto; }
.p-top { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.p-top h2 { margin: 0; font: 900 28px var(--display); color: #fff; text-shadow: 0 3px 0 var(--ink); }
.p-levels { justify-content: center; }
.p-card {
  width: 100%;
  padding: 28px 20px;
  border: 4px solid var(--ink);
  border-radius: 26px;
  background: #fff;
  box-shadow: 0 7px 0 var(--ink);
  text-align: center;
}
.p-q { font: 900 clamp(40px, 12vw, 72px) var(--display); margin-bottom: 18px; }
.p-form { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.p-form input {
  width: 160px;
  height: 64px;
  border: 3px solid var(--ink);
  border-radius: 18px;
  text-align: center;
  font: 900 32px var(--display);
  color: var(--ink);
}
.p-go { width: 160px; height: 64px; font-size: 26px; animation: none; }
.p-msg { min-height: 24px; margin-top: 14px; font: 800 17px var(--font); }
.p-msg.good { color: #1f9d55; }
.p-msg.bad { color: #d6334f; }
.p-stats { display: flex; gap: 12px; }
.p-stats div {
  min-width: 96px;
  padding: 10px 12px;
  border: 3px solid var(--ink);
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 4px 0 var(--ink);
  text-align: center;
}
.p-stats b { display: block; font: 900 28px var(--display); }
.p-stats span { font: 800 12px var(--font); opacity: 0.7; }
.p-top .pill { justify-self: start; }
</style>

</head>
<body>
<canvas id="view" aria-label="Game view"></canvas>
<div id="hud" class="hud"></div>
<div id="touch" class="touch"></div>

<div id="home" class="home on">
  <div class="h-wrap">
    <h1 class="logo"><span class="l1">SMASHY</span><span class="l2">KARTED</span></h1>
    <p class="h-sub">Pick what you want to do.</p>
    <div class="h-cards">
      <button id="go-math" class="h-card math" type="button"><b>➗</b><span>Math</span><small>Adding, taking away, times</small></button>
      <button id="go-kart" class="h-card kart" type="button"><b>🏎️</b><span>Kart Game</span><small>Online kart battles</small></button>
    </div>
  </div>
</div>

<div id="practice" class="practice">
  <div class="p-wrap">
    <header class="p-top">
      <button id="p-back" class="pill" type="button">← Home</button>
      <h2>Math</h2>
      <span></span>
    </header>
    <div class="p-card">
      <div id="p-q" class="p-q"></div>
      <form id="p-form" class="p-form" autocomplete="off">
        <input id="p-in" inputmode="numeric" pattern="-?[0-9]*" aria-label="Your answer">
        <button class="play p-go" type="submit">CHECK</button>
      </form>
      <div id="p-msg" class="p-msg"></div>
    </div>
  </div>
</div>

<div id="menu" class="menu">
  <div class="m-wrap">
    <header class="m-top">
      <h1 class="logo"><span class="l1">SMASHY</span><span class="l2">KARTED</span></h1>
      <div class="m-topr">
        <button id="m-home" class="pill" type="button">← Home</button>
        <div id="status" class="status wait"><i></i><span>Loading…</span></div>
      </div>
    </header>

    <section class="m-panel m-left">
      <label class="lbl" for="name">Driver name</label>
      <input id="name" maxlength="16" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <div class="lbl">Kart color</div>
      <div id="colors" class="colors"></div>
    </section>

    <div id="stage" class="m-stage" aria-hidden="true">
      <div class="m-plate"><span id="plate-name"></span></div>
    </div>

    <section class="m-panel m-right">
      <div class="lbl">Match</div>
      <div class="opts">
        <button id="map" class="pill" type="button" hidden></button>
        <button id="karts" class="pill" type="button"></button>
        <button id="minutes" class="pill" type="button"></button>
      </div>
      <div class="lbl">Settings</div>
      <div class="opts">
        <button id="quality" class="pill" type="button"></button>
        <button id="sound" class="pill" type="button"></button>
        <button id="mathmode" class="pill" type="button"></button>
      </div>
      <ul class="keys">
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive</li>
        <li><kbd>Shift</kbd> drift &amp; boost</li>
        <li><kbd>Space</kbd> fire</li>
        <li><kbd>Tab</kbd> scores</li>
      </ul>
    </section>

    <footer class="m-bottom">
      <button id="play" class="play" type="button">PLAY</button>
      <p class="tag">Grab a box. Smash a kart. Repeat.</p>
    </footer>
  </div>
</div>
